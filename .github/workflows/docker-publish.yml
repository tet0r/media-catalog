name: Build and publish image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Hardcoded rather than ${{ github.repository }}: that dynamic form is
  # what silently kept publishing to the pre-rename image path last time
  # this repo was renamed — GHCR doesn't migrate an existing package just
  # because its linked repo gets a new name, so a rename alone never
  # actually moves where this pushes. Bump this by hand if you rename
  # again and actually want the image path to follow.
  IMAGE_NAME: tet0r/media-catalog

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
