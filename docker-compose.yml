services:
  movie-cataloger:
    image: ghcr.io/tet0r/movie-cataloger:latest
    container_name: movie-cataloger
    ports:
      - "8080:8080"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # MOVIES_DIR must list every mount point below (comma-separated, no
      # spaces) — each volume only gets scanned if it's named here too.
      - MOVIES_DIR=/movies,/movies2,/movies3
    volumes:
      # App data: the SQLite database + cached posters. Keep this on a
      # persistent path so your collection survives container rebuilds.
      - ./data:/data
      # Your movie library, split across three network shares. These are
      # named volumes (defined below) backed by the CIFS/SMB driver, NOT
      # plain bind mounts — see "Network shares" in the README for why:
      # Docker Desktop's WSL2 backend frequently fails to resolve a plain
      # "//server/share" bind-mount path (it mounts empty, with no error),
      # so this mounts the share directly using the Linux VM's own CIFS
      # client instead, which doesn't go through Windows at all.
      - movies1:/movies:ro
      - movies2:/movies2:ro
      - movies3:/movies3:ro
    restart: unless-stopped

volumes:
  movies1:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/movies/ShareOne/Movies"
  movies2:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/movies/ShareTwo/Movies"
  movies3:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/movies/Movies"
