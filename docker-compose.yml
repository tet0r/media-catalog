services:
  media-catalog:
    image: ghcr.io/tet0r/media-catalog:latest
    container_name: media-catalog
    ports:
      - "8080:8080"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Each _DIR must list every mount point for that media type
      # (comma-separated, no spaces) — a volume only gets scanned if it's
      # named here too. Add more (e.g. MOVIES_DIR=/movies,/movies2) if you
      # split a library across multiple folders — see the README.
      - MOVIES_DIR=/movies
      - AUDIOBOOKS_DIR=/audiobooks
      - COMICS_DIR=/comics
      - EBOOKS_DIR=/ebooks
      - ALBUMS_DIR=/albums
      - TV_DIR=/tv
      # Local sync target for a LaunchBox installation's Data/Images
      # folders — see "Games" in the README.
      - LAUNCHBOX_DIR=/launchbox
      # Where scheduled/manual backups land — see "Backups" in the README.
      - BACKUP_DIR=/backups
    volumes:
      # App data: the SQLite database + cached posters/covers. Keep this
      # on a persistent path so your collection survives container
      # rebuilds. WARNING if deploying via Portainer's web editor: a
      # relative path like "./data" resolves to a folder Portainer manages
      # for you, and some stack changes can cause it to get recreated from
      # scratch — see "Data & persistence" in the README.
      - ./data:/data
      # Point each of these at your actual local folders. Set the matching
      # _PATH variable in .env, or just replace the left side directly.
      - ${MOVIES_PATH:-./movies}:/movies:ro
      - ${AUDIOBOOKS_PATH:-./audiobooks}:/audiobooks:ro
      - ${COMICS_PATH:-./comics}:/comics:ro
      - ${EBOOKS_PATH:-./ebooks}:/ebooks:ro
      - ${ALBUMS_PATH:-./albums}:/albums:ro
      - ${TV_PATH:-./tv}:/tv:ro
      - ${LAUNCHBOX_SYNC_PATH:-./launchbox}:/launchbox:ro
      # Backups — ideally point BACKUP_SYNC_PATH somewhere independent of
      # ./data (a different disk/share) — see "Backups" in the README.
      - ${BACKUP_SYNC_PATH:-./backups}:/backups
    restart: unless-stopped
