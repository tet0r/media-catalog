services:
  media-catalog:
    image: ghcr.io/tet0r/media-catalog:latest
    container_name: media-catalog
    ports:
      - "8080:8080"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # MOVIES_DIR must list every movie mount point below (comma-separated,
      # no spaces) — each volume only gets scanned if it's named here too.
      - MOVIES_DIR=/movies,/movies2,/movies3
      # Same idea for the audiobook library.
      - AUDIOBOOKS_DIR=/audiobooks
      # Same idea for the ebook library.
      - EBOOKS_DIR=/ebooks
      # Same idea for the music (album) library.
      - ALBUMS_DIR=/albums
      # Same idea for the TV library.
      - TV_DIR=/tv
      # Where your synced LaunchBox Data/ and Images/ folders land on this
      # Docker host — see "Games" in the README. Unlike the other _DIR vars,
      # this points at a plain local folder (bind-mounted below), not a
      # network share: LaunchBox usually runs on a different PC than this
      # server, so you keep a copy of its Data/Images folders synced to
      # somewhere on this machine (e.g. via a scheduled robocopy/rsync/
      # Syncthing job) rather than mounting the other PC's share live.
      - LAUNCHBOX_DIR=/launchbox
    volumes:
      # App data: the SQLite database + cached posters/covers. Keep this on
      # a persistent path so your collection survives container rebuilds.
      - ./data:/data
      # Your movie library, split across three network shares. These are
      # named volumes (defined below) backed by the CIFS/SMB driver, NOT
      # plain bind mounts — see "Network shares" in the README for why:
      # Docker Desktop's WSL2 backend frequently fails to resolve a plain
      # "//server/share" bind-mount path (it mounts empty, with no error),
      # so this mounts the share directly using the Linux VM's own CIFS
      # client instead, which doesn't go through Windows at all.
      - movies1:/movies:ro
      - movies2:/movies2:ro
      - movies3:/movies3:ro
      # Audiobooks, on the same network share as the movies (same SMB_HOST/
      # USER/PASS), just a different sub-path.
      - audiobooks1:/audiobooks:ro
      # Ebooks, same idea again — same share, different sub-path.
      - ebooks1:/ebooks:ro
      # Music, same idea again — same share, different sub-path.
      - albums1:/albums:ro
      # TV, same idea again — same share, different sub-path.
      - tv1:/tv:ro
      # Your synced local copy of LaunchBox's Data/ and Images/ folders — a
      # plain bind mount (not a CIFS volume like the ones above) since this
      # is meant to be a local path on the Docker host itself, e.g.
      # C:\LaunchBoxSync if you've synced it there. Change the host side
      # (left of the colon) to wherever you keep that synced copy.
      - ${LAUNCHBOX_SYNC_PATH:-./launchbox}:/launchbox:ro
    restart: unless-stopped

volumes:
  movies1:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE1}"
  movies2:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE2}"
  movies3:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE3}"
  audiobooks1:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE_AUDIOBOOKS}"
  ebooks1:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE_EBOOKS}"
  albums1:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE_ALBUMS}"
  tv1:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,file_mode=0444,dir_mode=0555"
      device: "//${SMB_HOST}/${SMB_SHARE_TV}"
