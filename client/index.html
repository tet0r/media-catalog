<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d2026" />
  <!-- Safari ignores manifest.json's icons; this is what "Add to Home
       Screen" actually uses. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Media Catalog" />
  <title>Media Catalog</title>
  <!-- Sets the theme before first paint so a light-mode user doesn't see a
       dark flash while the bundle loads. Mirrors theme.js's getThemeMode. -->
  <script>
    (function () {
      var mode = 'dark';
      try { mode = localStorage.getItem('theme') || 'dark'; } catch (e) {}
      if (mode === 'system') {
        mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
